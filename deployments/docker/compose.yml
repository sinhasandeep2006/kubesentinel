# Local development database only. Credentials are dev defaults, bound to localhost.
services:
  postgres:
    image: postgres:17
    container_name: kubesentinel-postgres
    environment:
      POSTGRES_USER: kubesentinel
      POSTGRES_PASSWORD: kubesentinel
      POSTGRES_DB: kubesentinel
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kubesentinel"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
